<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stereoscopic Video</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: true">
      <a-assets>
        <!-- Replace with your stereo video -->
        <video
          id="stereoVid"
          src="assets/videos/1/sun.mp4"
          autoplay
          loop
          muted
          playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <!-- Left Eye View -->
      <a-video
        src="#stereoVid"
        width="4"
        height="2"
        position="-0.1 1.6 -4"
        material="shader: flat; src: #stereoVid; repeat: 0.5 1; offset: 0 0"
        stereo="eye:left"
      ></a-video>

      <!-- Right Eye View -->
      <a-video
        src="#stereoVid"
        width="4"
        height="2"
        position="0.1 1.6 -4"
        material="shader: flat; src: #stereoVid; repeat: 0.5 1; offset: 0.5 0"
        stereo="eye:right"
      ></a-video>
    </a-scene>
  </body>
</html>
