<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stereoscopic Videoing</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: true">
      <a-assets>
        <video
          id="stereoVid"
          src="assets/videos/2/satellite-separation.mp4"
          autoplay
          loop
          muted
          playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-video
        src="#stereoVid"
        width="4"
        height="2"
        position="0 1.6 -4"
        material="shader: flat;"
      ></a-video>
    </a-scene>
  </body>
</html>
